[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "prompt-tokensaver"
version = "0.2.0"
description = "Count tokens across AI models and get concrete, priced suggestions to cut your prompt costs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "tokensaver contributors" }]
keywords = ["tokens", "llm", "openai", "claude", "gemini", "cost", "prompt", "tiktoken"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tiktoken>=0.8",
]

[project.urls]
Homepage = "https://github.com/behrouzbk/tokensaver"
Issues = "https://github.com/behrouzbk/tokensaver/issues"
Changelog = "https://github.com/behrouzbk/tokensaver/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tokensaver = "tokensaver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tokensaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.format]
line-ending = "lf"
